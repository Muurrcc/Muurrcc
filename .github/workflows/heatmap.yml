name: Update heatmap
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_contribs.py ${{ github.repository_owner }}
      - run: python scripts/render_heatmap.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contribs.json assets/heatmap.svg
          git diff --staged --quiet || git commit -m "chore: update heatmap [skip ci]"
          git push
